[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onnx-edge-ids"
version = "0.4.0"
description = "Lightweight ONNX/NumPy serving layer for edge IDS classifiers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
kafka = [
    "kafka-python>=2.0.2",
]
onnx = [
    "onnx>=1.14",
    "onnxruntime>=1.16",
]
export = [
    "onnx>=1.14",
]
gate = [
    "joblib>=1.3",
    "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
