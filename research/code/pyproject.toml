[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "edgeids-research"
version = "0.1.0"
description = "Library behind the research experiments: forest traversals, ONNX graph reader, datasets, gates and boundary probes"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.setuptools]
packages = ["edgeids"]
